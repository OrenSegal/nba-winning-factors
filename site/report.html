<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA winning factors</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; } img { background:#fff; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,sans-serif; max-width:60rem; margin:0 auto; padding:2rem 16px; }
  table { border-collapse:collapse; display:block; overflow-x:auto; font-size:.85rem; margin:1rem 0; }
  th,td { border:1px solid var(--line); padding:.3rem .6rem; text-align:left; white-space:nowrap; }
  img { max-width:100%; height:auto; }
  a { color:inherit; } header p { color:var(--mut); }
</style>
</head>
<body>
<header><p><a href="/">Back to the story</a></p>
  <h1>What drives NBA wins? Full technical report</h1>
  <p>2000-01 to 2025-26 regular seasons. Pre-game forecasting kept separate from after-the-fact attribution. Generated by <code>python -m nbawin.run</code>.</p>
</header>
<main id="out">Loading report...</main>
<noscript>This page renders report.md in the browser; enable JavaScript or read <a href="report.md">report.md</a>.</noscript>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch("report.md").then(r => r.text()).then(t => { document.getElementById("out").innerHTML = marked.parse(t); })
    .catch(() => { document.getElementById("out").textContent = "Could not load report.md"; });
</script>
</body>
</html>
